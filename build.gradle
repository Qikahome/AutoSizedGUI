plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.78'
}

version = '1.0.8b'
group = 'qikahome'

base {
    archivesName = 'AutoSizedGUI-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public'
        content {
            includeGroupByRegex '.*'
        }
    }
    mavenCentral()
    maven {
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

legacyForge {
    version = "1.20.1-47.4.0"

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        autosizedgui {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Runtime mods (modRuntimeOnly 会由 legacyForge 自动做 SRG -> named 重映射，对应 ForgeGradle 的 fg.deobf)
    modRuntimeOnly "mezz.jei:jei-1.20.1-forge:15.21.0.148"
    modRuntimeOnly "curse.maven:inventory-profiles-next-495267:7565992"
    modRuntimeOnly "curse.maven:libipn-679177:5208511"
    modRuntimeOnly "curse.maven:kotlin-for-forge-351264:7291067"
}

java {
    withSourcesJar()
}

tasks.named("jar") {
    manifest {
        attributes([
                "Specification-Title"     : "autosizedgui",
                "Specification-Vendor"    : "qikahome",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "qikahome",
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/Qikahome/AutoSizedGUI"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
