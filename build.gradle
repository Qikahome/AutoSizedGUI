// Root build: orchestration only — no loader plugin is applied here.
plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.78' apply false
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.property('group')
    version = rootProject.property('mod_version')

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)

    repositories {
        maven {
            // hanbings 第三方代理：镜像 fabricmc/mavenCentral 等，缓解国外源过慢（若失效可移除）
            url 'https://repository.hanbings.io/proxy/'
        }
        maven {
            url 'https://maven.aliyun.com/repository/public'
            content {
                includeGroupByRegex '.*'
            }
        }
        mavenCentral()
        maven {
            // Minecraft 运行库（text2speech 等 Mojang 专属，仅发布于官方库）
            url "https://libraries.minecraft.net/"
        }
        maven {
            url "https://maven.neoforged.net/releases"
        }
        maven {
            url "https://maven.fabricmc.net/"
        }
        maven {
            name 'BlameJared Maven'
            url 'https://maven.blamejared.com'
            content {
                includeGroup 'mezz.jei'
            }
        }
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
