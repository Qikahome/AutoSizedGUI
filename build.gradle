plugins {
    id 'idea'
    id 'maven-publish'
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.property('group')
    version = rootProject.property('mod_version')

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }

    repositories {
        maven {
            // 国内镜像兜底（hanbings 第三方全量代理，失效可注释）
            url 'https://repository.hanbings.io/proxy/'
            content { includeGroupByRegex '.*' }
        }
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
        maven {
            url 'https://libraries.minecraft.net/'
            content { includeGroup 'com.mojang' }
        }
        maven {
            url 'https://maven.neoforged.net/releases'
            content { includeGroupByRegex 'net\\.neoforged.*' }
        }
        maven {
            url 'https://maven.fabricmc.net/'
            content { includeGroupByRegex 'net\\.fabricmc.*' }
        }
        maven {
            url 'https://cursemaven.com'
            content { includeGroup 'curse.maven' }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // MIT：再分发（含 jar-in-jar 内嵌）须随附版权与许可声明，故打进 jar 与 sources jar
    tasks.named('jar', Jar) {
        from(rootProject.file('LICENSE')) { into 'META-INF' }
    }
    tasks.matching { it.name == 'sourcesJar' }.configureEach {
        it.from(rootProject.file('LICENSE')) { into 'META-INF' }
    }
}
