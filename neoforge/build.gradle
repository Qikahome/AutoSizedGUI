plugins {
    id 'net.neoforged.moddev' version "${mod_dev_gradle_version}"
    id 'maven-publish'
}

base {
    archivesName = 'AutoSizedGUI-26.1.2'
}

def commonProject = project(':common')

sourceSets.main {
    java.srcDirs(commonProject.sourceSets.main.java.srcDirs)
    resources.srcDirs(commonProject.sourceSets.main.resources.srcDirs)
}

neoForge {
    version = neoforge_version

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        configureEach {
            gameDirectory = rootProject.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        autosizedgui {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // dev 运行期 mods（仅 dev，不随 jar 发布）
    runtimeOnly "curse.maven:jei-238222:8752596"
    runtimeOnly "curse.maven:inventory-profiles-next-495267:8610197"
    runtimeOnly "curse.maven:libipn-679177:8608757"
}

tasks.named('jar') {
    manifest {
        attributes([
                "Specification-Title"    : "autosizedgui",
                "Specification-Vendor"   : "qikahome",
                "Specification-Version"  : "1",
                "Implementation-Title"   : project.name,
                "Implementation-Version" : project.version,
                "Implementation-Vendor"  : "qikahome",
        ])
    }
}

// ===== 单 jar 双 loader（26.1+ 无混淆，字节码两端通用）=====
// fabric 端源码/元数据由 :fabric 模块编译；这里把 fabric 产物并入本 jar，
// 使其同时携带 neoforge.mods.toml(@Mod 类)与 fabric.mod.json(fabric 入口类)。
// 两端类名互不重复、运行期各自只加载自己的入口，故可共存。
def fabricProject = project(':fabric')

tasks.named('jar') {
    dependsOn fabricProject.tasks.jar
    from(zipTree(fabricProject.tasks.jar.archiveFile)) {
        // fabric jar 与 common assets 重复的部分取本模块版本即可（内容一致）
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/Qikahome/AutoSizedGUI"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
